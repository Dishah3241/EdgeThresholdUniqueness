# source must formalize, adapt or independently prove the result, which makes it source-based.
sources:
  - title: "Stage 0 — does the FKS induction give uniqueness at C(d+2,2) edges?"
    id: "file:///Users/dishant/Code/Math/docs/research/2026-09-22-stage0-end-problem-uniqueness.md"
    type: "other"
    location: >-
      The sketch as a whole; the equality-count case analysis and the calibration for d = 5 and
      d ≥ 6
    relationship: "adapts"
    author_endorsement: "n/a"
    note: >-
      Informal argument that the FKS induction, with the budget raised to C(d + 2, 2), leaves
      only K_{d+2} plus isolated vertices. The sketch states this for every d ≥ 5. The frozen
      statement is the d ≥ 6 case, with the no-isolated-vertex hypothesis. Run
      20260922-160618-c2949ba8.
  - title: "Independent check of the end-problem sketch"
    id: "file:///Users/dishant/Code/Math/docs/research/2026-09-22-independent-check-end-problem.md"
    type: "other"
    location: >-
      The branch table for d ≥ 6, and the numerical script
      docs/research/2026-09-22-independent-check-end-problem.py
    relationship: "independently-proves"
    author_endorsement: "n/a"
    note: >-
      Re-derivation of each branch against the TeX proof of Frankl–Kupavskii–Swanepoel
      Theorem 3. The verdict in that note is that the argument holds for every d ≥ 6, using
      S(d − 1) as written. It treats d = 5 as the Chaffee–Noble classification and does not
      re-check the d = 5 Case 2 construction. The check is informal.
  - title: "Embedding graphs in Euclidean space"
    authors:
      - "Nóra Frankl"
      - "Andrey Kupavskii"
      - "Konrad J. Swanepoel"
    id: "https://arxiv.org/abs/1802.03092"
    type: "paper"
    location: >-
      J. Combin. Theory Ser. A 171 (2020) 105146; arXiv:1802.03092, main.tex, the definition of
      f(d) at line 82 and the theorem labeled d+2 choose 2 at line 91
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The inequality theorem this statement builds on: for d > 3, fewer than C(d + 2, 2) edges
      yields a unit-distance representation in R^d. The paper records that K_{d+2} is not
      realizable, so f(d) ≤ C(d + 2, 2), and cites Chaffee–Noble for the equality cases d = 4
      and d = 5. Uniqueness for d ≥ 6 is not that theorem.

