# formalization.yaml v0.4, written to Palomar's stricter rules. Validate it against the v0.4
# schema and Palomar's own loader after every edit, and take every model name from a run log.
version: "v0.4"

project:
  name: "Uniqueness of K_{d+2} at C(d+2,2) edges for d >= 6"
  # The registry abstract, at most 10,000 characters: the mathematical content and the principal
  # results, readable without the repository.
  description: >-
    For every natural number d ≥ 6, every finite simple graph on Fin n with exactly
    C(d + 2, 2) edges, with no isolated vertex, and with no injective placement of its vertices
    into Euclidean d-space under which every edge has length 1, is isomorphic to the complete
    graph K_{d+2}. A non-edge may also have length 1. The proof is
    SimpleGraph.nonempty_iso_completeGraph_of_not_unitDistEmbeddable in the GraphDimension
    library, specialized at V = Fin n. Frankl, Kupavskii and Swanepoel (2020) prove the strict
    inequality: for d > 3, fewer than C(d + 2, 2) edges yields such a placement. This statement
    is the equality case for d ≥ 6, with the no-isolated-vertex hypothesis, so the conclusion is
    isomorphism with K_{d+2} itself.
  authors:                 # humans only; credit models under `automation`
    - "Dishant Shah"
  responsible_maintainers:
    - "Dishant Shah"
  license: "Apache-2.0"    # must match the root LICENSE exactly

classification:            # one to eight codes from Palomar's taxonomy snapshots
  # The local TeX of arXiv:1802.03092 has no MSC line. These codes are the ones recorded for
  # that paper in projects/FKSEdgeThreshold/formalization.yaml.
  arxiv: ["math.CO", "math.MG"]
  msc2020: ["05C62", "52C10"]

