status:
  scope: >-
    Finite simple graphs SimpleGraph (Fin n), every natural number d ≥ 6, exactly
    C(d + 2, 2) edges, no isolated vertex, and no unit-distance representation in Euclidean
    d-space. The conclusion is isomorphism with K_{d+2}. The inequality theorem, the spherical
    clause, and the cases d < 6 are out of scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
