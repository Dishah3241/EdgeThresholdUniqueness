limitations: >-
  The frozen statement is the d ≥ 6 equality case for finite simple graphs with no isolated
  vertex. It does not include d = 5, the inequality theorem, or the spherical clause. The proof
  depends on GraphDimension at the sibling path ../GraphDimension, not at a pinned revision.

