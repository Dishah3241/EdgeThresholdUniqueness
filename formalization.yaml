      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

fidelity:
  divergences: >-
    The Stage 0 sketch concludes that, for every d ≥ 5, the only graphs with C(d + 2, 2) edges
    and no placement in R^d are K_{d+2} together with isolated vertices, and it treats d = 5 by
    a Case 2 construction together with the Chaffee–Noble citation in the FKS source. The
    independent check states the counting argument for every d ≥ 6 and sets d = 5 aside. The
    frozen statement and GraphDimension's
    nonempty_iso_completeGraph_of_not_unitDistEmbeddable are the d ≥ 6 case. The no-isolated-vertex
    hypothesis makes the conclusion isomorphism with K_{d+2} itself; a graph that is K_{d+2}
    plus an isolated vertex has the same number of edges and still has no placement, and it
    fails that hypothesis. Statement A names the placement condition UnitDistanceRepresentable.
    Statement B uses HasUnitDistanceRepresentation, the inhabitant of the library embedding.
    EdgeThresholdUniqueness.Stage1.Equivalence proves the two claims agree, and
    inlineIffStatementA identifies the inlined claim with Statement A by rfl. The manager's
    commit c3f8fd3 marks Statement B's definitions @[expose], with no change of meaning, so an
    importer can unfold them.

